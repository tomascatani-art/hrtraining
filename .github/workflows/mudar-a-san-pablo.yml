# Se corre UNA vez, a mano (Actions → "Mudar la base a San Pablo" → Run workflow).
# Copia la base de datos y los archivos del Supabase viejo (Estados Unidos) al nuevo (San Pablo).
# No borra nada del viejo. Si la base nueva ya tiene datos, se frena sin tocar nada.
name: Mudar la base a San Pablo
on:
  workflow_dispatch:
jobs:
  mudar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
      NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
      OLD_SUPABASE_URL: ${{ secrets.OLD_SUPABASE_URL }}
      OLD_SUPABASE_KEY: ${{ secrets.OLD_SUPABASE_KEY }}
      NEW_SUPABASE_URL: ${{ secrets.NEW_SUPABASE_URL }}
      NEW_SUPABASE_KEY: ${{ secrets.NEW_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que estén los 6 secretos
        run: |
          for v in OLD_DB_URL NEW_DB_URL OLD_SUPABASE_URL OLD_SUPABASE_KEY NEW_SUPABASE_URL NEW_SUPABASE_KEY; do
            if [ -z "${!v}" ]; then echo "Falta el secreto $v"; exit 1; fi
          done
          # Las herramientas de Postgres no aceptan ?connection_limit=1 ni ?pgbouncer: se saca lo que va después del "?"
          echo "OLD=${OLD_DB_URL%%\?*}" >> $GITHUB_ENV
          echo "NEW=${NEW_DB_URL%%\?*}" >> $GITHUB_ENV
      - name: Instalar Postgres 17 (cliente)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Frenar si la base nueva ya tiene datos
        run: |
          n=$(/usr/lib/postgresql/17/bin/psql "$NEW" -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "Tablas en la base nueva: $n"
          if [ "$n" != "0" ]; then echo "La base nueva no está vacía. No toco nada."; exit 1; fi
      - name: Copiar la base de datos
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$OLD" --schema=public --no-owner --no-privileges --format=plain \
            | grep -v -E '^(CREATE SCHEMA public;|COMMENT ON SCHEMA public)' > dump.sql
          echo "Tamaño de la copia: $(du -h dump.sql | cut -f1)"
          /usr/lib/postgresql/17/bin/psql "$NEW" -v ON_ERROR_STOP=1 -q -f dump.sql
      - name: Comparar cantidades (vieja vs nueva)
        run: |
          q="select string_agg(format('%s=%s', t, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', t), false, true, '')))[1]::text), ' ' order by t) from (select table_name t from information_schema.tables where table_schema='public' and table_type='BASE TABLE') x"
          a=$(/usr/lib/postgresql/17/bin/psql "$OLD" -tAc "$q"); b=$(/usr/lib/postgresql/17/bin/psql "$NEW" -tAc "$q")
          echo "Vieja: $a"; echo "Nueva: $b"
          if [ "$a" != "$b" ]; then echo "Las cantidades no coinciden"; exit 1; fi
          echo "Base copiada completa."
      - name: Copiar los archivos (fotos, documentos, logos)
        run: node scripts/copiar-archivos.mjs
