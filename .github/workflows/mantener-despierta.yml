# Cada 5 minutos visita la app para que no se "duerma" (así el primer toque no tarda).
name: Mantener la app despierta
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -s -o /dev/null -w "health %{http_code} %{time_total}s\n" https://hrtraining-nine.vercel.app/api/health || true
          curl -s -o /dev/null -w "login %{http_code} %{time_total}s\n" https://hrtraining-nine.vercel.app/login || true
